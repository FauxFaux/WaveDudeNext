# The issue form for a feature request: what the user wants to do, the feature as imagined, and how it is done today.
name: Feature request
description: Something WaveDude Next should be able to do
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the idea. What you want to achieve matters as much as the feature itself, so please describe both.
  - type: textarea
    id: goal
    attributes:
      label: What you want to do
      description: The simulation or the task you have in mind, and where WaveDude Next stands in your way today.
    validations:
      required: true
  - type: textarea
    id: feature
    attributes:
      label: The feature
      description: How you imagine it, where it would sit in the app and what it would do. A sketch, a screenshot or a project file helps; drag it into the box.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: A workaround, another program that has it, or a paper or video that describes it. Leave empty if there is none.
    validations:
      required: false
